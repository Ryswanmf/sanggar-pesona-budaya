<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38040C"/>
      <stop offset="50%" stop-color="#660F1F"/>
      <stop offset="100%" stop-color="#1D0206"/>
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldMat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="35%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6314"/>
    </linearGradient>

    <!-- Card Inner Shadow / Vignette -->
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="30%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </radialGradient>

    <!-- Pattern Definition -->
    <pattern id="cardPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0 L40 20 L20 40 L0 20 Z" fill="none" stroke="#D4AF37" stroke-width="0.7" opacity="0.12"/>
      <circle cx="20" cy="20" r="1.5" fill="#D4AF37" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#cardPattern)"/>

  <!-- Radial Glow Behind Subject -->
  <circle cx="400" cy="240" r="210" fill="#D4AF37" opacity="0.12"/>
  <circle cx="400" cy="240" r="130" fill="#FFE57F" opacity="0.1"/>

  <!-- Geometric Frame Borders (Traditional Lampung Tapis Motif Borders) -->
  <rect x="25" y="25" width="750" height="550" rx="8" fill="none" stroke="#D4AF37" stroke-width="1.2" opacity="0.45"/>
  <rect x="35" y="35" width="730" height="530" rx="4" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.25"/>

  <!-- Corner Corner Ornaments -->
  <g fill="#D4AF37" opacity="0.7">
    <!-- Top-Left -->
    <path d="M25 55 L55 25 L45 25 L25 45 Z"/>
    <circle cx="40" cy="40" r="3"/>
    <!-- Top-Right -->
    <path d="M775 55 L745 25 L755 25 L775 45 Z"/>
    <circle cx="760" cy="40" r="3"/>
    <!-- Bottom-Left -->
    <path d="M25 545 L55 575 L45 575 L25 555 Z"/>
    <circle cx="40" cy="560" r="3"/>
    <!-- Bottom-Right -->
    <path d="M775 545 L745 575 L755 575 L775 555 Z"/>
    <circle cx="760" cy="560" r="3"/>
  </g>

  <!-- Category Badge at Top Left -->
  <g transform="translate(55, 55)">
    <rect width="160" height="32" rx="16" fill="#1C1917" stroke="#D4AF37" stroke-width="1.2"/>
    <text x="80" y="21" fill="#FFE082" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">LAYANAN UNGGULAN</text>
  </g>

  <!-- Metro, Lampung Badge at Top Right -->
  <g transform="translate(605, 55)">
    <rect width="140" height="32" rx="16" fill="rgba(0,0,0,0.4)" stroke="rgba(212,175,55,0.4)" stroke-width="1"/>
    <text x="70" y="21" fill="#FAF7F2" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5" text-anchor="middle">Metro, Lampung</text>
  </g>

  <!-- Main Visual Subject -->
  
        <!-- Dancer Silhouette & Siger -->
        <g transform="translate(400, 260) scale(1.1)">
          <!-- Siger Headdress -->
          <path d="M0 -110 L8 -85 L28 -100 L24 -75 L50 -88 L40 -60 L75 -70 L55 -45 L0 -35 L-55 -45 L-75 -70 L-40 -60 L-50 -88 L-24 -75 L-28 -100 L-8 -85 Z" fill="url(#goldMat)" stroke="#FFE082" stroke-width="1.5" />
          <circle cx="0" cy="-115" r="4" fill="#FFE57F" />
          <!-- Head & Face Profile -->
          <ellipse cx="0" cy="-42" rx="20" ry="24" fill="#E8B88A" />
          <!-- Sanggul / Hair -->
          <ellipse cx="0" cy="-60" rx="32" ry="16" fill="#1A1A1A" />
          <!-- Neck & Shoulders -->
          <path d="M-8 -20 L8 -20 L15 5 L-15 5 Z" fill="#E8B88A" />
          <!-- Kalung / Golden Chest Collar (Bulan Temanggal) -->
          <path d="M-45 5 Q0 35 45 5 Q0 18 -45 5 Z" fill="url(#goldMat)" stroke="#AA771C" stroke-width="1" />
          <path d="M-35 15 Q0 45 35 15 Q0 28 -35 15 Z" fill="url(#goldMat)" />
          <!-- Torso with Tapis Bustier -->
          <path d="M-30 5 L30 5 L35 70 L-35 70 Z" fill="#7B1123" stroke="#D4AF37" stroke-width="1.5" />
          <!-- Golden Tapis Waistband / Pending -->
          <rect x="-38" y="65" width="76" height="18" rx="4" fill="url(#goldMat)" stroke="#AA771C" stroke-width="1" />
          <circle cx="0" cy="74" r="6" fill="#800020" stroke="#FFE57F" stroke-width="1.5" />
          <!-- Arms in graceful gesture (nyembah/tari) -->
          <path d="M-30 10 Q-70 15 -85 55 Q-90 85 -70 85 Q-60 80 -45 40" fill="none" stroke="#E8B88A" stroke-width="10" stroke-linecap="round" />
          <path d="M30 10 Q70 15 85 55 Q90 85 70 85 Q60 80 45 40" fill="none" stroke="#E8B88A" stroke-width="10" stroke-linecap="round" />
          <!-- Tanggai (golden fingernails) -->
          <path d="M-72 85 Q-82 98 -90 92" stroke="url(#goldMat)" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M-68 87 Q-76 102 -84 97" stroke="url(#goldMat)" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M72 85 Q82 98 90 92" stroke="url(#goldMat)" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M68 87 Q76 102 84 97" stroke="url(#goldMat)" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- Dynamic Shawl / Selendang Emas -->
          <path d="M-35 45 C-120 70 -130 160 -80 180 C-40 195 -10 140 -20 90" fill="none" stroke="url(#goldMat)" stroke-width="7" opacity="0.85" />
          <path d="M35 45 C120 70 130 160 80 180 C40 195 10 140 20 90" fill="none" stroke="url(#goldMat)" stroke-width="7" opacity="0.85" />
        </g>
        

  <!-- Vignette Gradient -->
  <rect width="800" height="600" fill="url(#vignette)"/>

  <!-- Bottom Content Card Area -->
  <g transform="translate(55, 470)">
    <!-- Small Divider Accent -->
    <line x1="0" y1="0" x2="60" y2="0" stroke="url(#goldMat)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Title -->
    <text x="0" y="38" fill="#FFFDF9" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700">Pertunjukan Seni Tari</text>
    
    <!-- Subtitle -->
    <text x="0" y="68" fill="#D4AF37" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="400" letter-spacing="0.3">Tari Siger Penguten, Bedana, & Kreasi Adat</text>
  </g>
</svg>