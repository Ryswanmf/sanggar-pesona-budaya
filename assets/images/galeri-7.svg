<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38040C"/>
      <stop offset="50%" stop-color="#660F1F"/>
      <stop offset="100%" stop-color="#1D0206"/>
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldMat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="35%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6314"/>
    </linearGradient>

    <!-- Card Inner Shadow / Vignette -->
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="30%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </radialGradient>

    <!-- Pattern Definition -->
    <pattern id="cardPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0 L40 20 L20 40 L0 20 Z" fill="none" stroke="#D4AF37" stroke-width="0.7" opacity="0.12"/>
      <circle cx="20" cy="20" r="1.5" fill="#D4AF37" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#cardPattern)"/>

  <!-- Radial Glow Behind Subject -->
  <circle cx="400" cy="240" r="210" fill="#D4AF37" opacity="0.12"/>
  <circle cx="400" cy="240" r="130" fill="#FFE57F" opacity="0.1"/>

  <!-- Geometric Frame Borders (Traditional Lampung Tapis Motif Borders) -->
  <rect x="25" y="25" width="750" height="550" rx="8" fill="none" stroke="#D4AF37" stroke-width="1.2" opacity="0.45"/>
  <rect x="35" y="35" width="730" height="530" rx="4" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.25"/>

  <!-- Corner Corner Ornaments -->
  <g fill="#D4AF37" opacity="0.7">
    <!-- Top-Left -->
    <path d="M25 55 L55 25 L45 25 L25 45 Z"/>
    <circle cx="40" cy="40" r="3"/>
    <!-- Top-Right -->
    <path d="M775 55 L745 25 L755 25 L775 45 Z"/>
    <circle cx="760" cy="40" r="3"/>
    <!-- Bottom-Left -->
    <path d="M25 545 L55 575 L45 575 L25 555 Z"/>
    <circle cx="40" cy="560" r="3"/>
    <!-- Bottom-Right -->
    <path d="M775 545 L745 575 L755 575 L775 555 Z"/>
    <circle cx="760" cy="560" r="3"/>
  </g>

  <!-- Category Badge at Top Left -->
  <g transform="translate(55, 55)">
    <rect width="160" height="32" rx="16" fill="#1C1917" stroke="#D4AF37" stroke-width="1.2"/>
    <text x="80" y="21" fill="#FFE082" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">LATIHAN</text>
  </g>

  <!-- Metro, Lampung Badge at Top Right -->
  <g transform="translate(605, 55)">
    <rect width="140" height="32" rx="16" fill="rgba(0,0,0,0.4)" stroke="rgba(212,175,55,0.4)" stroke-width="1"/>
    <text x="70" y="21" fill="#FAF7F2" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5" text-anchor="middle">Metro, Lampung</text>
  </g>

  <!-- Main Visual Subject -->
  
        <!-- Dance Class / Practice Mentorship -->
        <g transform="translate(400, 260) scale(1.05)">
          <!-- Mentor / Guru Tari -->
          <g transform="translate(-110, 0)">
            <ellipse cx="0" cy="-70" rx="18" ry="22" fill="#E8B88A" />
            <ellipse cx="0" cy="-85" rx="26" ry="14" fill="#1C1917" />
            <!-- Baju Latihan Elegan -->
            <path d="M-28 -40 L28 -40 L35 70 L-35 70 Z" fill="#800020" />
            <!-- Golden waist sash -->
            <rect x="-38" y="10" width="76" height="12" fill="url(#goldMat)" rx="2"/>
            <!-- Posing Arm guiding -->
            <path d="M28 -30 Q70 -20 95 -10" stroke="#E8B88A" stroke-width="8" stroke-linecap="round" fill="none" />
          </g>
          <!-- Murid / Young Student -->
          <g transform="translate(70, 25)">
            <ellipse cx="0" cy="-60" rx="15" ry="19" fill="#E8B88A" />
            <ellipse cx="0" cy="-73" rx="20" ry="12" fill="#1C1917" />
            <path d="M-22 -35 L22 -35 L28 55 L-28 55 Z" fill="#500A15" />
            <rect x="-30" y="5" width="60" height="10" fill="url(#goldMat)" rx="2"/>
            <!-- Student graceful arm imitating -->
            <path d="M-22 -25 Q-60 -35 -75 -15" stroke="#E8B88A" stroke-width="7" stroke-linecap="round" fill="none" />
            <path d="M22 -25 Q60 -15 80 -40" stroke="#E8B88A" stroke-width="7" stroke-linecap="round" fill="none" />
          </g>
          <!-- Music Notes / Rhythm aura -->
          <circle cx="-10" cy="-60" r="16" fill="url(#goldMat)" opacity="0.2"/>
          <path d="M-15 -65 L-5 -75 L-5 -55 Z" fill="url(#goldMat)" />
          <path d="M15 -90 Q30 -110 50 -100" stroke="url(#goldMat)" stroke-width="2.5" fill="none" stroke-dasharray="4,4" />
        </g>
        

  <!-- Vignette Gradient -->
  <rect width="800" height="600" fill="url(#vignette)"/>

  <!-- Bottom Content Card Area -->
  <g transform="translate(55, 470)">
    <!-- Small Divider Accent -->
    <line x1="0" y1="0" x2="60" y2="0" stroke="url(#goldMat)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Title -->
    <text x="0" y="38" fill="#FFFDF9" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700">Latihan Olah Wiraga & Wirama</text>
    
    <!-- Subtitle -->
    <text x="0" y="68" fill="#D4AF37" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="400" letter-spacing="0.3">Pembentukan Karakter & Disiplin Seni Penari Muda</text>
  </g>
</svg>