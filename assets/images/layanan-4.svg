<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38040C"/>
      <stop offset="50%" stop-color="#660F1F"/>
      <stop offset="100%" stop-color="#1D0206"/>
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldMat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="35%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6314"/>
    </linearGradient>

    <!-- Card Inner Shadow / Vignette -->
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="30%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </radialGradient>

    <!-- Pattern Definition -->
    <pattern id="cardPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0 L40 20 L20 40 L0 20 Z" fill="none" stroke="#D4AF37" stroke-width="0.7" opacity="0.12"/>
      <circle cx="20" cy="20" r="1.5" fill="#D4AF37" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#cardPattern)"/>

  <!-- Radial Glow Behind Subject -->
  <circle cx="400" cy="240" r="210" fill="#D4AF37" opacity="0.12"/>
  <circle cx="400" cy="240" r="130" fill="#FFE57F" opacity="0.1"/>

  <!-- Geometric Frame Borders (Traditional Lampung Tapis Motif Borders) -->
  <rect x="25" y="25" width="750" height="550" rx="8" fill="none" stroke="#D4AF37" stroke-width="1.2" opacity="0.45"/>
  <rect x="35" y="35" width="730" height="530" rx="4" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.25"/>

  <!-- Corner Corner Ornaments -->
  <g fill="#D4AF37" opacity="0.7">
    <!-- Top-Left -->
    <path d="M25 55 L55 25 L45 25 L25 45 Z"/>
    <circle cx="40" cy="40" r="3"/>
    <!-- Top-Right -->
    <path d="M775 55 L745 25 L755 25 L775 45 Z"/>
    <circle cx="760" cy="40" r="3"/>
    <!-- Bottom-Left -->
    <path d="M25 545 L55 575 L45 575 L25 555 Z"/>
    <circle cx="40" cy="560" r="3"/>
    <!-- Bottom-Right -->
    <path d="M775 545 L745 575 L755 575 L775 555 Z"/>
    <circle cx="760" cy="560" r="3"/>
  </g>

  <!-- Category Badge at Top Left -->
  <g transform="translate(55, 55)">
    <rect width="160" height="32" rx="16" fill="#1C1917" stroke="#D4AF37" stroke-width="1.2"/>
    <text x="80" y="21" fill="#FFE082" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">BUSANA ANAK</text>
  </g>

  <!-- Metro, Lampung Badge at Top Right -->
  <g transform="translate(605, 55)">
    <rect width="140" height="32" rx="16" fill="rgba(0,0,0,0.4)" stroke="rgba(212,175,55,0.4)" stroke-width="1"/>
    <text x="70" y="21" fill="#FAF7F2" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5" text-anchor="middle">Metro, Lampung</text>
  </g>

  <!-- Main Visual Subject -->
  
        <!-- Royal Costume & Siger Pepadun -->
        <g transform="translate(400, 255) scale(1.15)">
          <!-- Grand Siger with 9 Horns -->
          <path d="M0 -125 L9 -95 L30 -115 L26 -85 L55 -100 L44 -70 L85 -80 L60 -50 L105 -55 L75 -25 L0 -15 L-75 -25 L-105 -55 L-60 -50 L-85 -80 L-44 -70 L-55 -100 L-26 -85 L-30 -115 L-9 -95 Z" fill="url(#goldMat)" stroke="#FFE082" stroke-width="1.8" />
          <circle cx="0" cy="-128" r="4.5" fill="#FFF2B2" />
          <!-- Mannequin / Royal Attire -->
          <ellipse cx="0" cy="5" rx="30" ry="12" fill="url(#goldMat)" />
          <!-- Baju Kurung Bludru Merah Marun -->
          <path d="M-45 10 L45 10 L60 110 L-60 110 Z" fill="#6B0B1A" stroke="#D4AF37" stroke-width="2" />
          <!-- Papan Jajar & Bulan Temanggal (Golden necklace ornament) -->
          <path d="M-35 25 Q0 55 35 25" fill="none" stroke="url(#goldMat)" stroke-width="5" />
          <path d="M-40 45 Q0 75 40 45" fill="none" stroke="url(#goldMat)" stroke-width="5" />
          <path d="M-45 65 Q0 95 45 65" fill="none" stroke="url(#goldMat)" stroke-width="5" />
          <!-- Kain Tapis Lampung Embroidery Pattern -->
          <g transform="translate(0, 110)">
            <rect x="-65" y="0" width="130" height="75" fill="#24050A" stroke="#D4AF37" stroke-width="1.5" />
            <path d="M-60 20 L-40 5 L-20 20 L0 5 L20 20 L40 5 L60 20" stroke="url(#goldMat)" stroke-width="2.5" fill="none"/>
            <path d="M-60 45 L-40 30 L-20 45 L0 30 L20 45 L40 30 L60 45" stroke="url(#goldMat)" stroke-width="2.5" fill="none"/>
            <path d="M-60 65 L-40 50 L-20 65 L0 50 L20 65 L40 50 L60 65" stroke="url(#goldMat)" stroke-width="2.5" fill="none"/>
          </g>
          <!-- Selempang Emas Cross -->
          <line x1="-50" y1="12" x2="55" y2="105" stroke="url(#goldMat)" stroke-width="8" opacity="0.9" />
          <line x1="50" y1="12" x2="-55" y2="105" stroke="url(#goldMat)" stroke-width="8" opacity="0.9" />
        </g>
        

  <!-- Vignette Gradient -->
  <rect width="800" height="600" fill="url(#vignette)"/>

  <!-- Bottom Content Card Area -->
  <g transform="translate(55, 470)">
    <!-- Small Divider Accent -->
    <line x1="0" y1="0" x2="60" y2="0" stroke="url(#goldMat)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Title -->
    <text x="0" y="38" fill="#FFFDF9" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700">Baju Adat & Profesi Anak</text>
    
    <!-- Subtitle -->
    <text x="0" y="68" fill="#D4AF37" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="400" letter-spacing="0.3">Koleksi Busana Adat Nusantara & Kostum Profesi Cilik</text>
  </g>
</svg>