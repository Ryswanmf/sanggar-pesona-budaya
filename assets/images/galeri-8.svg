<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451B05"/>
      <stop offset="50%" stop-color="#702A0B"/>
      <stop offset="100%" stop-color="#260E03"/>
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldMat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="35%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6314"/>
    </linearGradient>

    <!-- Card Inner Shadow / Vignette -->
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="30%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </radialGradient>

    <!-- Pattern Definition -->
    <pattern id="cardPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0 L40 20 L20 40 L0 20 Z" fill="none" stroke="#F3E5AB" stroke-width="0.7" opacity="0.12"/>
      <circle cx="20" cy="20" r="1.5" fill="#F3E5AB" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#cardPattern)"/>

  <!-- Radial Glow Behind Subject -->
  <circle cx="400" cy="240" r="210" fill="#D4AF37" opacity="0.12"/>
  <circle cx="400" cy="240" r="130" fill="#FFE57F" opacity="0.1"/>

  <!-- Geometric Frame Borders (Traditional Lampung Tapis Motif Borders) -->
  <rect x="25" y="25" width="750" height="550" rx="8" fill="none" stroke="#F3E5AB" stroke-width="1.2" opacity="0.45"/>
  <rect x="35" y="35" width="730" height="530" rx="4" fill="none" stroke="#F3E5AB" stroke-width="0.8" opacity="0.25"/>

  <!-- Corner Corner Ornaments -->
  <g fill="#F3E5AB" opacity="0.7">
    <!-- Top-Left -->
    <path d="M25 55 L55 25 L45 25 L25 45 Z"/>
    <circle cx="40" cy="40" r="3"/>
    <!-- Top-Right -->
    <path d="M775 55 L745 25 L755 25 L775 45 Z"/>
    <circle cx="760" cy="40" r="3"/>
    <!-- Bottom-Left -->
    <path d="M25 545 L55 575 L45 575 L25 555 Z"/>
    <circle cx="40" cy="560" r="3"/>
    <!-- Bottom-Right -->
    <path d="M775 545 L745 575 L755 575 L775 555 Z"/>
    <circle cx="760" cy="560" r="3"/>
  </g>

  <!-- Category Badge at Top Left -->
  <g transform="translate(55, 55)">
    <rect width="160" height="32" rx="16" fill="#1C1917" stroke="#F3E5AB" stroke-width="1.2"/>
    <text x="80" y="21" fill="#FFE082" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">KEGIATAN</text>
  </g>

  <!-- Metro, Lampung Badge at Top Right -->
  <g transform="translate(605, 55)">
    <rect width="140" height="32" rx="16" fill="rgba(0,0,0,0.4)" stroke="rgba(212,175,55,0.4)" stroke-width="1"/>
    <text x="70" y="21" fill="#FAF7F2" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5" text-anchor="middle">Metro, Lampung</text>
  </g>

  <!-- Main Visual Subject -->
  
        <!-- Event & Ceremony (Payung Agung & Stage Lights) -->
        <g transform="translate(400, 250) scale(1.1)">
          <!-- Payung Agung Lampung (Ceremonial Umbrellas) -->
          <!-- Left Umbrella (Gold) -->
          <g transform="translate(-120, -10)">
            <path d="M0 -60 Q55 -40 55 -10 L-55 -10 Q-55 -40 0 -60 Z" fill="url(#goldMat)" stroke="#AA771C" stroke-width="1.5"/>
            <path d="M-55 -10 Q0 5 55 -10" fill="none" stroke="#FFE082" stroke-width="3"/>
            <!-- Rumbai payung -->
            <line x1="-50" y1="-8" x2="-50" y2="2" stroke="#FFF2B2" stroke-width="2"/>
            <line x1="-25" y1="-5" x2="-25" y2="5" stroke="#FFF2B2" stroke-width="2"/>
            <line x1="0" y1="-4" x2="0" y2="6" stroke="#FFF2B2" stroke-width="2"/>
            <line x1="25" y1="-5" x2="25" y2="5" stroke="#FFF2B2" stroke-width="2"/>
            <line x1="50" y1="-8" x2="50" y2="2" stroke="#FFF2B2" stroke-width="2"/>
            <line x1="0" y1="-10" x2="0" y2="120" stroke="#B8860B" stroke-width="4"/>
          </g>
          <!-- Right Umbrella (White/Silver Adat) -->
          <g transform="translate(120, -10)">
            <path d="M0 -60 Q55 -40 55 -10 L-55 -10 Q-55 -40 0 -60 Z" fill="#F4EADB" stroke="#C5A059" stroke-width="1.5"/>
            <path d="M-55 -10 Q0 5 55 -10" fill="none" stroke="#D4AF37" stroke-width="3"/>
            <!-- Rumbai payung -->
            <line x1="-50" y1="-8" x2="-50" y2="2" stroke="#D4AF37" stroke-width="2"/>
            <line x1="-25" y1="-5" x2="-25" y2="5" stroke="#D4AF37" stroke-width="2"/>
            <line x1="0" y1="-4" x2="0" y2="6" stroke="#D4AF37" stroke-width="2"/>
            <line x1="25" y1="-5" x2="25" y2="5" stroke="#D4AF37" stroke-width="2"/>
            <line x1="50" y1="-8" x2="50" y2="2" stroke="#D4AF37" stroke-width="2"/>
            <line x1="0" y1="-10" x2="0" y2="120" stroke="#8A6B1E" stroke-width="4"/>
          </g>
          <!-- Center Ceremonial Siger Gate -->
          <path d="M-70 110 L-70 15 L0 -25 L70 15 L70 110 Z" fill="none" stroke="url(#goldMat)" stroke-width="3" stroke-dasharray="8,4"/>
          <circle cx="0" cy="40" r="35" fill="#7A1021" stroke="url(#goldMat)" stroke-width="2"/>
          <path d="M0 20 L4 32 L14 26 L12 38 L22 30 L18 42 L28 40 L0 58 L-28 40 L-18 42 L-22 30 L-12 38 L-14 26 L-4 32 Z" fill="url(#goldMat)"/>
        </g>
        

  <!-- Vignette Gradient -->
  <rect width="800" height="600" fill="url(#vignette)"/>

  <!-- Bottom Content Card Area -->
  <g transform="translate(55, 470)">
    <!-- Small Divider Accent -->
    <line x1="0" y1="0" x2="60" y2="0" stroke="url(#goldMat)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Title -->
    <text x="0" y="38" fill="#FFFDF9" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700">Apresiasi & Temu Budaya</text>
    
    <!-- Subtitle -->
    <text x="0" y="68" fill="#D4AF37" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="400" letter-spacing="0.3">Kolaborasi Bersama Komunitas Pelestari Seni Lampung</text>
  </g>
</svg>